# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches: [ master, 'version_*' ]
  pull_request:
    branches: [ master, 'version_*' ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        uv sync
    - name: Lint with ruff
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uv run ruff check . --select=E9,F63,F7,F82 --ignore=E203,W503
        # exit-zero treats all errors as warnings
        uv run ruff check . --exit-zero --max-complexity=10
    - name: Check ruff formatter was run
      run: |
        uv run ruff format . --check
    - name: Check type hints with mypy
      run: |
        uv run mypy --ignore-missing-imports .
    - name: Run tests and check coverage
      run: |
        # Fail if total coverage is below 95%
        uv run pytest --cov=. --cov-fail-under=95 tests/
